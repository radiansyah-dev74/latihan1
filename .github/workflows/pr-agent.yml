name: Qodo PR Review (Self-Hosted)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-agent:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qodo PR-Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Activating Qodo virtualenv"
          source /home/ubuntu/pr-agent/.venv/bin/activate

          cd /home/ubuntu/pr-agent

          echo "Running Qodo PR Agent for PR:"
          echo "${{ github.event.pull_request.html_url }}"

          python -m pr_agent.cli --issue_url "${{ github.event.pull_request.html_url }}"
