name: Qodo PR Review (Self-Hosted)

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qodo-pr-agent:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Run Qodo PR Agent (auto + interactive)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          source /home/ubuntu/pr-agent/.venv/bin/activate
          cd /home/ubuntu/pr-agent

          # ===============================
          # AUTO REVIEW ON PR EVENT
          # ===============================
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_URL="${{ github.event.pull_request.html_url }}"
            echo "Auto review on PR:"
            echo "$PR_URL"

            python -m pr_agent.cli \
              --pr_url="$PR_URL" \
              improve \
              --pr_reviewer.extra_instructions="Be very strict. Highlight bugs, smells, missing tests, security risks, and performance issues."

          # ===============================
          # INTERACTIVE COMMANDS
          # ===============================
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            BODY="${{ github.event.comment.body }}"

            # ❗ INI YANG PENTING
            PR_URL="${{ github.event.issue.pull_request.html_url }}"

            echo "Command received:"
            echo "$BODY"
            echo "PR:"
            echo "$PR_URL"

            if [[ "$BODY" == /ask* ]]; then
              python -m pr_agent.cli \
                --pr_url="$PR_URL" \
                ask "${BODY#/ask }"

            elif [[ "$BODY" == /review* ]]; then
              python -m pr_agent.cli \
                --pr_url="$PR_URL" \
                review

            elif [[ "$BODY" == /improve* ]]; then
              python -m pr_agent.cli \
                --pr_url="$PR_URL" \
                improve

            else
              echo "No Qodo command detected"
            fi
          fi
