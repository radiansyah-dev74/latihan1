name: Qodo PR Review (Self-Hosted)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qodo PR Agent (CI Mode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Activating Qodo virtualenv"
          source /home/ubuntu/pr-agent/.venv/bin/activate

          cd /home/ubuntu/pr-agent

          echo "Running Qodo in CI PR review mode"
          python -m pr_agent.cli
