name: Qodo PR Review (Self-Hosted)

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qodo-pr-agent:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qodo PR Agent (auto + interactive)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=== Activating Qodo venv ==="
          source /home/ubuntu/pr-agent/.venv/bin/activate
          cd /home/ubuntu/pr-agent

          # ---- CASE 1: PR EVENT (auto review / improve) ----
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_URL="${{ github.event.pull_request.html_url }}"
            echo "Running Qodo IMPROVE on PR:"
            echo "$PR_URL"

            python -m pr_agent.cli \
              --pr_url="$PR_URL" \
              improve \
              --pr_reviewer.extra_instructions="Act as a very strict senior engineer. Be critical. Point out bad patterns, missing tests, security issues, performance problems, and architecture smells. Prefer concrete code suggestions."

          # ---- CASE 2: COMMENT EVENT (/ask, /review, etc) ----
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            BODY="${{ github.event.comment.body }}"
            ISSUE_URL="${{ github.event.issue.html_url }}"

            echo "Comment received:"
            echo "$BODY"

            if [[ "$BODY" == /ask* ]]; then
              QUESTION="${BODY#/ask }"
              python -m pr_agent.cli \
                --issue_url="$ISSUE_URL" \
                ask "$QUESTION"

            elif [[ "$BODY" == /review* ]]; then
              python -m pr_agent.cli \
                --pr_url="$ISSUE_URL" \
                review

            elif [[ "$BODY" == /improve* ]]; then
              python -m pr_agent.cli \
                --pr_url="$ISSUE_URL" \
                improve \
                --pr_reviewer.extra_instructions="Be extremely strict and detailed. Suggest refactors, edge cases, and tests."

            else
              echo "No Qodo command detected. Ignoring."
            fi
          fi
