name: Qodo PR Review (Self-Hosted)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# ⬇️ INI YANG KEMARIN KURANG
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qodo PR Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Activating Qodo venv"
          source /home/ubuntu/pr-agent/.venv/bin/activate

          cd /home/ubuntu/pr-agent

          echo "Running Qodo on PR:"
          echo "${{ github.event.pull_request.html_url }}"

          python -m pr_agent.cli \
            --issue_url "${{ github.event.pull_request.html_url }}"
